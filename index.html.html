<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>nini</title>

    <link rel="icon" type="image/png" href="favicon.png">

    <style>

        /* ================================
           RESET
        ================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html,
        body {
            width: 100%;
            height: 100%;
        }


        body {
            background: #000;
            color: #fff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            overflow: hidden;
        }


        /* ================================
           MAIN PAGE
        ================================= */

        .page {
            width: 100%;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: flex-start;

            position: relative;
        }


        .profile-container {

            width: 100%;

            display: flex;
            flex-direction: column;
            align-items: center;

            /*
                CHANGE THIS NUMBER TO MOVE
                THE WHOLE PROFILE UP/DOWN
            */

            padding-top: 312px;
        }


        /* ================================
           PROFILE IMAGE
        ================================= */

        .profile {

            width: 80px;
            height: 80px;

            border-radius: 50%;

            overflow: hidden;

            background: #111;

            flex-shrink: 0;
        }


        .profile img {

            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;
        }


        /* ================================
           NAME
        ================================= */

        .name {

            margin-top: 25px;

            font-size: 16px;

            font-weight: 700;

            color: #fff;

            line-height: 1;
        }


        /* ================================
           TYPEWRITER TEXT
        ================================= */

        .typewriter {

            margin-top: 10px;

            height: 20px;

            color: #999;

            font-size: 14px;

            font-weight: 500;

            cursor: pointer;

            text-align: center;

            transition: .2s ease;

            text-shadow:
                0 0 4px rgba(255,255,255,.15);
        }


        .typewriter:hover {

            color: #fff;

            text-shadow:
                0 0 5px rgba(255,255,255,.7),
                0 0 12px rgba(255,255,255,.25);
        }


        /* blinking cursor */

        .cursor {

            display: inline-block;

            width: 1px;

            height: 14px;

            margin-left: 2px;

            background: #fff;

            vertical-align: -2px;

            animation: blink .8s infinite;
        }


        @keyframes blink {

            0%,
            45% {
                opacity: 1;
            }

            46%,
            100% {
                opacity: 0;
            }
        }


        /* ================================
           SOCIAL ICONS
        ================================= */

        .socials {

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 42px;

            margin-top: 43px;

            opacity: 1;

            transition:
                opacity .4s ease,
                transform .4s ease;
        }


        .social {

            width: 42px;
            height: 42px;

            display: flex;

            align-items: center;
            justify-content: center;

            color: #fff;

            text-decoration: none;

            cursor: pointer;

            filter:
                drop-shadow(0 0 4px rgba(255,255,255,.8))
                drop-shadow(0 0 9px rgba(255,255,255,.35));

            transition:
                transform .2s ease,
                filter .2s ease;
        }


        .social:hover {

            transform:
                translateY(-4px)
                scale(1.08);

            filter:
                drop-shadow(0 0 6px rgba(255,255,255,1))
                drop-shadow(0 0 15px rgba(255,255,255,.55));
        }


        .social svg {

            width: 27px;
            height: 27px;

            fill: currentColor;
        }


        /* X ICON */

        .x-icon {

            font-size: 30px;

            font-weight: 300;

            line-height: 1;
        }


        /* ================================
           COMMUNITY CARD
        ================================= */

        .community-card {

            width: 384px;
            height: 83px;

            margin-top: 24px;

            border: 1px solid #242428;

            border-radius: 16px;

            background: #030303;

            display: flex;

            align-items: center;

            padding: 11px 18px;

            box-shadow:
                0 8px 30px rgba(0,0,0,.7);

            transition:
                border-color .2s ease,
                transform .2s ease;
        }


        .community-card:hover {

            border-color: #3a3a40;

            transform: translateY(-1px);
        }


        /* ================================
           COMMUNITY IMAGE
        ================================= */

        .community-image {

            width: 56px;
            height: 56px;

            border-radius: 13px;

            overflow: hidden;

            flex-shrink: 0;

            background: #fff;
        }


        .community-image img {

            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;
        }


        /* ================================
           COMMUNITY TEXT
        ================================= */

        .community-info {

            flex: 1;

            margin-left: 16px;

            min-width: 0;
        }


        .community-name {

            color: #fff;

            font-size: 16px;

            font-weight: 700;

            margin-bottom: 5px;
        }


        .community-stats {

            color: #999;

            font-size: 13px;

            font-weight: 500;

            white-space: nowrap;
        }


        /* ================================
           JOIN BUTTON
        ================================= */

        .join {

            border: none;

            background: transparent;

            color: #fff;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            padding: 12px 18px;

            text-shadow:
                0 0 5px rgba(255,255,255,.8),
                0 0 12px rgba(255,255,255,.25);

            transition:
                transform .2s ease,
                text-shadow .2s ease;
        }


        .join:hover {

            transform: scale(1.08);

            text-shadow:
                0 0 7px rgba(255,255,255,1),
                0 0 18px rgba(255,255,255,.5);
        }


        /* ================================
           MUSIC PLAYER
        ================================= */

        .music-player {

            position: fixed;

            left: 30px;
            bottom: 25px;

            height: 30px;

            display: flex;

            align-items: center;

            gap: 9px;
        }


        .play-button {

            width: 27px;
            height: 27px;

            border-radius: 50%;

            border: 2px solid #fff;

            background: #000;

            color: #fff;

            display: flex;

            align-items: center;
            justify-content: center;

            cursor: pointer;

            font-size: 10px;

            box-shadow:
                0 0 5px rgba(255,255,255,.8);

            transition: .2s ease;
        }


        .play-button:hover {

            transform: scale(1.08);

            box-shadow:
                0 0 10px rgba(255,255,255,1);
        }


        /* volume slider */

        .volume {

            width: 65px;

            appearance: none;

            height: 4px;

            border-radius: 5px;

            background: #fff;

            outline: none;

            cursor: pointer;
        }


        .volume::-webkit-slider-thumb {

            appearance: none;

            width: 11px;
            height: 11px;

            border-radius: 50%;

            background: #fff;

            cursor: pointer;
        }


        /* ================================
           MOBILE
        ================================= */

        @media (max-width: 600px) {

            .profile-container {

                padding-top: 220px;
            }


            .socials {

                gap: 25px;
            }


            .community-card {

                width:
                    calc(100% - 40px);

                max-width: 384px;
            }


            .music-player {

                left: 20px;
                top: 20px;
            }
        }

    </style>

</head>


<body>

</style>
            <!-- ==========================

            =========================== -->

            <div class="community-card">


                <div class="community-image">

      <!-- ================================

    ================================= -->

    <div class="music-player">


        <button class="play-button" id="playButton">
    ▶
</button>


        <input
            class="volume"
            type="range"
            min="0"
            max="100"
            value="50"
            id="volume"
        >


        <audio
            id="audio"
            src="music.mp3"
            loop

    <script>
const messages = [
    "welcome! >,.,<",
    "thx for being here ♡"
];

const typewriter = document.getElementById("typewriter");

let messageIndex = 0;
let letterIndex = 0;

function type() {
    const message = messages[messageIndex];

    if (letterIndex < message.length) {
        typewriter.textContent += message[letterIndex];
        letterIndex++;

        setTimeout(type, 80);
    } else {
        // Wait before deleting
        setTimeout(erase, 2000);
    }
}

function erase() {
    if (letterIndex > 0) {
        typewriter.textContent =
            typewriter.textContent.substring(0, letterIndex - 1);

        letterIndex--;

        setTimeout(erase, 50);
    } else {
        // Move to the next message
        messageIndex++;

        if (messageIndex >= messages.length) {
            messageIndex = 0;
        }

        // Small pause before typing the next message
        setTimeout(type, 500);
    }
}

type();

        /* ================================
           MUSIC
        ================================= */

        const audio =
            document.getElementById("audio");

        const playButton =
            document.getElementById("playButton");


        let playing = false;


        playButton.addEventListener(
            "click",
            function() {

                if (playing) {

                    audio.pause();

                    playButton.textContent = "<3";

                    playing = false;

                } else {

                    audio.play();

                    playButton.textContent = "</3";

                    playing = true;

                }

            }
        );


        /* ================================
           VOLUME
        ================================= */

        const volume =
            document.getElementById("volume");


        volume.addEventListener(
            "input",
            function() {

                audio.volume =
                    volume.value / 100;

            }
        );


        audio.volume = .5;


        /* ================================
           JOIN BUTTON
        ================================= */

        function joinCommunity() {

                COMMUNITY INVITE
            */

                "https://discord.gg/Pn5M2bN4P",
                "_blank"
            );

        }

    </script>
